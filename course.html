<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Detail - LeAn</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">LeAn</a>
    <div class="header-controls">
      <a href="index.html" class="nav-btn" style="text-decoration:none; display:inline-block;">← Back</a>
      <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
    </div>
  </header>

  <main>
    <div class="detail-container">
      <!-- Video Player -->
      <div id="video-container" class="video-player-container">
        <!-- Replaced by YT API -->
        <div id="video-player-placeholder"></div>
      </div>

      <!-- Course Info -->
      <div class="course-info">
        <div class="course-header">
          <div class="course-header-top">
            <span id="course-source" class="card-source">Source</span>
            <h1 id="course-title" class="card-title" style="font-size: 1.8rem;">Loading...</h1>
            <div id="course-meta" class="card-meta">Category • Level • Duration</div>
          </div>

          <div class="course-actions-bar">
             <a id="official-site-btn" href="#" target="_blank" class="btn-secondary">Visit Official Website</a>
             <button id="detail-save-btn" class="btn-primary" style="background:none; border: 1px solid var(--primary-color); color: var(--primary-color);">
               ☆ Save to Library
             </button>
          </div>
        </div>
        <p id="course-desc" class="course-description">
          <!-- Full description here -->
        </p>
      </div>

      <!-- Lectures -->
      <div class="lectures-section">
        <h3>Lectures</h3>
        <ul id="lecture-list" class="lecture-list">
          <!-- Lecture items here -->
        </ul>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
