<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeAn - Learn Anything</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">LeAn</a>
    <div class="header-controls">
      <button id="library-btn" class="nav-btn">My Library</button>
      <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
    </div>
  </header>

  <main>
    <h1 id="page-title" style="margin-bottom: 1.5rem;">Browse Courses</h1>

    <section class="filters">
      <input type="text" id="search-input" class="search-bar" placeholder="Search courses...">
      <select id="category-select" class="category-filter">
        <option value="All">All Categories</option>
        <option value="Programming">Programming</option>
        <option value="Data Science">Data Science</option>
        <option value="AI/ML">AI/ML</option>
        <option value="Web Development">Web Development</option>
      </select>
    </section>

    <div id="course-grid" class="course-grid">
      <!-- Courses will be injected here by app.js -->
      <p style="grid-column: 1/-1; text-align:center;">Loading courses...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
